[project]
name = "system1"
version = "0.1.0"
description = "System 1 data factory for HCMC AI Challenge multimedia retrieval"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "duckdb>=1.0.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "pyarrow>=15.0.0",
    "typer>=0.12.0",
    "pyyaml>=6.0.0",
    "huggingface_hub>=0.24.0",
    "jsonschema>=4.23.0",
    "opencv-python-headless>=4.10.0",
    "pillow>=10.4.0",
    "pydantic>=2.9.0",
]

[project.optional-dependencies]
phase01-production = [
    "bitsandbytes==0.47.0",
    "faster-whisper==1.2.1",
    "google-genai[aiohttp]==2.13.0",
    "nemo_toolkit[asr]==2.6.0",
    "onnx==1.18.0",
    "accelerate>=0.33.0",
    "einops>=0.8.0",
    "qwen-vl-utils>=0.0.8",
    "sentencepiece>=0.2.0",
    "timm>=1.0.0",
    "torch>=2.2.0,<2.9.0",
    "torchvision>=0.17.0,<0.24.0",
    "transformers>=4.51.0",
]

[project.scripts]
system1 = "system1.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.0.0",
    "ipykernel>=6.0.0",
    "jiwer>=3.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
