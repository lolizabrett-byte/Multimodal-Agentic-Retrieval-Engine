schema_version: phase01_pipeline_v1_2
pipeline_id: phase01_production_v1_2

execution:
  video_order: batch_manifest
  max_concurrent_videos: 1
  chunk_scheduler:
    max_chunk_videos: 4
    max_chunk_raw_bytes: 1610612736
    min_free_disk_gb: 20
    medium_free_disk_gb: 35
    medium_max_chunk_videos: 2
    low_disk_max_chunk_videos: 1
  # Kaggle shares 13-16 GB of host RAM across both GPU processes, so these are
  # sized for two concurrent workers (scripts/run_dual_gpu.py), not one.
  inference_batch_size:
    ocr: 4
    # 4 do duoc 3.47s/shot vs 4.97s o 2 — nhanh 30%, va dinh VRAM chi 7.71 GB
    # tren card 15 GB. Do tren 4 video chay tu dau, 431 shot.
    shot_captions: 4
  require_phase00_frame_timeline: true
  checkpoint_after_each_stage: true
  continue_after_retryable_video_failure: true
  gpu_heavy_models_resident: 1
  release_gpu_objects_before_empty_cache: true
  min_scratch_free_gb: 5
  min_model_cache_free_gb: 25

stages:
  order:
    - shots
    - keyframes
    - asr
    - ocr
    - shot_captions
    - shot_transcript_links
    - scenes
    - scene_summaries
    - package
    - sync
  dependencies:
    shots: []
    keyframes: [shots]
    asr: []
    ocr: [keyframes]
    shot_captions: [keyframes, ocr]
    shot_transcript_links: [shots, asr]
    scenes: [shots, keyframes, ocr, shot_captions, shot_transcript_links]
    scene_summaries: [scenes, keyframes, ocr, shot_captions, shot_transcript_links]
    package:
      - shots
      - keyframes
      - asr
      - ocr
      - shot_captions
      - shot_transcript_links
      - scenes
      - scene_summaries
    sync: [package]

shot_detection:
  model_key: shot_detection
  boundary_convention: "[start_frame, end_frame)"
  no_cut_status: transnet_v2_no_cut
  production_fallback: null

asr:
  model_key: asr
  no_audio_status: no_audio
  no_speech_status: no_speech
  exhausted_oom_status: failed_retryable
  continue_next_video_after_exhausted_oom: true

ocr:
  model_key: ocr
  run_on_keyframe_roles: [early, middle, late]
  empty_status: empty
  failed_status: failed
  text_presence_filter:
    enabled: true
    policy: opencv_conservative_v1
    max_long_side: 960
    canny_low: 50
    canny_high: 150
    # Measured keyframes sit at 0.037-0.164 edge density, so these thresholds
    # skip almost nothing. Recalibrate with research/ocr_asr/gate_calibration.py
    # against labelled data before widening them — a wrong threshold drops real text.
    max_no_text_edge_density: 0.0015
    max_no_text_gray_std: 12
  dedup:
    # The three role keyframes of a shot usually carry identical on-screen text.
    # Off until the real duplicate rate is measured on a batch; enabling it blind
    # risks collapsing frames whose text actually differs.
    enabled: false
    hamming_threshold: 4

shot_captions:
  failed_status: failed
  # A batch that is mostly failures signals a systemic outage (provider down,
  # bad prompt) rather than isolated per-shot flakiness — fail the stage loudly
  # instead of shipping a mostly-empty caption table.
  max_failed_ratio: 0.5

api:
  max_concurrency_per_video: 2
  request_cache_backend: stage_local
  total_attempts: 4
  timeout_seconds: 120
  backoff_initial_seconds: 2
  backoff_max_seconds: 30
  jitter: true
  retryable_http_statuses: [408, 429, 500, 502, 503, 504]
  terminal_http_statuses: [400, 401, 403, 404]
  schema_repair_prompt_version: schema_repair_v1

retry:
  local_model_total_attempts: 2
  schema_repair_attempts: 1

scene_grouping:
  # Vintern-3B khong giu noi 8 phan doan trong mot cau tra loi: lan chay 26/08
  # cho thay no chep thang vi du trong prompt thay vi phan doan. Hoi 2 gap moi
  # lan la viec vua suc hon, doi lai 162 request/video thay vi 54.
  focus_gap_count: 2
  context_shots_each_side: 4
  stride: 2
  # Mot gap khong phan xu duoc thi dung mac dinh "khong phai ranh gioi", thay vi
  # giet ca video sau khi moi stage truoc da chay xong. Phai vuot CA HAI nguong
  # moi bo video: san tuyet doi chan viec mot loi le giet video ngan (3 shot,
  # 1 gap hong da la 50%), ti le chan viec nuot loi hang loat.
  min_failed_gaps_before_abort: 3
  max_failed_gap_ratio: 0.25
  boundary_threshold: 0.67
  non_boundary_threshold: 0.33
  dense_boundary_count: 2
  dense_boundary_gap_window: 3
  strong_disagreement_min_votes: 2
  strong_disagreement_requires_both_labels: true
  max_consistency_review_rounds: 1
  # Mot video cat canh nhanh trigger gan het gap, gop lai thanh mot vung phu ca
  # video: 247 shot va 97k token trong mot request, khong card nao chiu noi.
  # 4 cho 13 shot moi request (~5.4k token, 7.67 GB tren card 15 GB) va mot nua
  # so request so voi 2 - dang ke khi ngan sach GPU la rang buoc chinh.
  consistency_review_max_gaps: 4
  scene_confidence_aggregation: null_v1

scene_summary:
  max_representative_images: 12
  image_sampling: evenly_spaced_shots
  # A batch that is mostly failures signals a systemic outage (provider down,
  # bad prompt) rather than isolated per-scene flakiness — fail the stage loudly
  # instead of shipping a mostly-empty summary table.
  max_failed_ratio: 0.5

manual_review:
  sample_size: 12
  sampling: deterministic_stratified
  kinds: [shot_caption, scene_boundary, scene_summary]

schemas:
  resolved_config: resolved_config_v1
  checkpoint_state: phase01_checkpoint_state_v1
  shots: shots_v1
  keyframes: keyframes_v2
  asr_segments: asr_segments_v1
  ocr: ocr_v2
  shot_captions: shot_captions_v2
  shot_transcript_links: shot_transcript_links_v1
  scenes: scenes_v1
  scene_transcript_links: scene_transcript_links_v1
  scene_summaries: scene_summaries_v2

production_readiness:
  required_non_null_paths:
    - models.shot_detection.model_revision
    - models.shot_detection.source_sha256
    - models.shot_detection.weights_sha256
    - models.asr.model_revision
    - models.ocr.model_id
    - models.ocr.model_revision
    - models.shot_caption.model_id
    - models.shot_caption.model_revision
    - media.keyframe.encoding.jpeg_quality
    - media.keyframe.quality.resize_width
    - media.keyframe.quality.resize_height
    - media.keyframe.quality.near_black_luma_threshold
    - media.keyframe.quality.near_black_pixel_ratio_threshold
    - media.keyframe.quality.near_white_luma_threshold
    - media.keyframe.quality.near_white_pixel_ratio_threshold
    - media.thumbnail.encoding.webp_quality
    - phase01.api.total_attempts
    - phase01.api.timeout_seconds
    - phase01.api.backoff_initial_seconds
    - phase01.api.backoff_max_seconds
    - phase01.api.schema_repair_prompt_version
    - phase01.retry.local_model_total_attempts
    - phase01.retry.schema_repair_attempts
    - phase01.scene_grouping.dense_boundary_count
    - phase01.scene_grouping.dense_boundary_gap_window
    - phase01.scene_grouping.strong_disagreement_min_votes
    - phase01.scene_grouping.max_consistency_review_rounds
    - phase01.scene_grouping.consistency_review_max_gaps
    - phase01.scene_grouping.scene_confidence_aggregation
    - storage.checkpoint.repo_id
